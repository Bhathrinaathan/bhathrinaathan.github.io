<script>
(function () {
  const { projectCard, esc } = window.site;
  const grid = document.getElementById('projectsGrid');
  const bar = document.getElementById('filterBar');
  fetch('projects.json').then(r => r.json()).then(projects => {
    const order = ['AI / ML', 'Agents & RL', 'Data & IR', 'Software'];
    const counts = {};
    projects.forEach(p => { counts[p.category] = (counts[p.category] || 0) + 1; });
    const cats = ['All', ...order.filter(c => counts[c]), ...Object.keys(counts).filter(c => !order.includes(c))];
    let active = (location.hash || '').replace('#', '') || 'All';
    if (!cats.includes(active)) active = 'All';

    projects.forEach(p => grid.appendChild(projectCard(p)));

    function apply() {
      grid.querySelectorAll('.project-card').forEach(card => {
        card.hidden = active !== 'All' && card.dataset.category !== active;
      });
      bar.querySelectorAll('.filter-pill').forEach(b => {
        const on = b.dataset.cat === active;
        b.classList.toggle('active', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }
    cats.forEach(cat => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'filter-pill'; b.dataset.cat = cat;
      b.innerHTML = `${esc(cat)}<span class="count">${cat === 'All' ? projects.length : counts[cat]}</span>`;
      b.addEventListener('click', () => { active = cat; history.replaceState(null, '', cat === 'All' ? location.pathname : '#' + cat); apply(); });
      bar.appendChild(b);
    });
    apply();
  }).catch(() => { grid.innerHTML = '<p class="section-sub">Could not load projects.json.</p>'; });
})();
</script>
